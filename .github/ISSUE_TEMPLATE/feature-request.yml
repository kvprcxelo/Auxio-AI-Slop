name: Feature Request
description: Propose new functionality for the Linux desktop player
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Welcome to the Auxio-AI-Slop feature request form. This repository releases the Linux
        desktop player; features that fit the scope of the port are most likely to be accepted.

        Check that the feature is not already implemented in the latest release or already
        requested before filing.
  - type: textarea
    id: desc
    attributes:
      label: Description
      description: Provide a clear and concise description of the feature.
      placeholder: I want ...
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem solved
      description: Is this related to a problem? Describe what is frustrating or missing.
      placeholder: I'm always frustrated when ...
  - type: textarea
    id: others
    attributes:
      label: Other implementations
      description: How do other music players or desktop apps handle this?
      placeholder: This player does ...
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Benefit
      description: How will this benefit everyone's use of the app? A convincing case makes the feature more likely to be accepted.
      placeholder: This feature allows ...
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Before submitting
      options:
        - label: I have searched existing feature requests for duplicates.
          required: true
        - label: I have checked that this feature is not implemented in the latest release.
          required: true
        - label: I agree to the [Contribution Guidelines](https://github.com/kvprcxelo/Auxio-AI-Slop/blob/dev/.github/CONTRIBUTING.md).
          required: true
