name: Bug/Crash Report
description: Report a problem with the Linux desktop player
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Welcome to the Auxio-AI-Slop bug report form. This repository releases the Linux desktop
        player; the Android app is inherited from upstream and is not the release target.

        Well-written reports are much easier to fix. Search existing issues first, and check the
        problem on the latest release before filing.
  - type: textarea
    id: desc
    attributes:
      label: Describe the bug or crash
      description: Provide a clear description of the issue and the exact steps to reproduce it.
      placeholder: |
        1. Open ...
        2. Click ...
        3. Scroll to ...
        4. See error
    validations:
      required: true
  - type: textarea
    id: intended
    attributes:
      label: What did you expect to happen?
      description: Describe the correct behavior. Examples from other music players are welcome.
      placeholder: It should ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release tag, AppImage filename, or commit you tested.
      placeholder: v0.12.5 / auxio-0.12.5-x86_64.AppImage / commit abc1234
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Linux environment
      description: Distribution and version, desktop environment, session type (Wayland or X11), and libmpv version if known.
      placeholder: Ubuntu 24.04, GNOME 46, Wayland, libmpv2 0.40.0
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: How are you running Auxio?
      options:
        - Downloaded AppImage
        - Built from source and ran the Gradle build
        - Ran a distributable from `createDistributable`
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Attach the app and mpv logs if possible. Run the AppImage with `AUXIO_LOG=~/auxio.log`
        and attach `auxio.log` and `auxio.log.mpv`. If the app does not start, paste the terminal
        output here.
      render: shell
    validations:
      required: false
  - type: textarea
    id: sample-file
    attributes:
      label: Sample file
      description: Only if the problem is specific to loading or playing a file. Upload the smallest file that reproduces it, or a link. Do not upload copyrighted music you cannot share.
    validations:
      required: false
  - type: checkboxes
    id: terms
    attributes:
      label: Before submitting
      options:
        - label: I have searched existing issues and pull requests for duplicates.
          required: true
        - label: I have checked that this issue still occurs on the latest release.
          required: true
        - label: I agree to the [Contribution Guidelines](https://github.com/kvprcxelo/Auxio-AI-Slop/blob/dev/.github/CONTRIBUTING.md).
          required: true
