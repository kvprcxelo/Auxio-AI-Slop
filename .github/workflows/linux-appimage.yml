name: Linux AppImage

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-24.04

    steps:
    - name: Clone repository
      uses: actions/checkout@v4
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libmpv2 file cmake ninja-build
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: "21"
        distribution: "temurin"
        cache: gradle
    - name: Grant execute permission
      run: chmod +x gradlew linux/packaging/build-appimage.sh
    - name: Build AppImage
      run: ./linux/packaging/build-appimage.sh
    - name: Verify AppImage
      run: |
        file linux/dist/*.AppImage
        chmod +x linux/dist/*.AppImage
    - name: Upload AppImage artifact
      uses: actions/upload-artifact@v4
      with:
        name: Auxio_Linux_AppImage
        path: linux/dist/*.AppImage
    - name: Attach AppImage to release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: linux/dist/*.AppImage
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
